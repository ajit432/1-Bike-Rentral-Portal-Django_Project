{% extends "base.html" %}

{% block title %}
New Password - BikeWala
{% endblock title %}

{% block body %}
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
        <div class="col-12">
            <div class="card mx-auto" style="max-width: 500px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);">
                <div class="card-body p-4 p-md-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-lock text-primary" style="font-size: 3rem;"></i>
                        </div>
                        <h2 class="card-title text-primary fw-bold mb-2">Set New Password</h2>
                        <p class="text-muted">Enter your new password below</p>
                    </div>
                    
                    <!-- Form -->
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="pw" class="form-label fw-semibold">
                                <i class="fas fa-key me-2"></i>New Password
                            </label>
                            <input type="password" 
                                   name="pw" 
                                   id="pw" 
                                   class="form-control form-control-lg" 
                                   placeholder="Enter new password"
                                   required
                                   style="background: var(--bg-tertiary); border: 2px solid var(--border-color); border-radius: 12px; color: var(--text-primary);">
                        </div>
                        
                        <div class="mb-4">
                            <label for="cpw" class="form-label fw-semibold">
                                <i class="fas fa-check-circle me-2"></i>Confirm New Password
                            </label>
                            <input type="password" 
                                   name="cpw" 
                                   id="cpw" 
                                   class="form-control form-control-lg" 
                                   placeholder="Confirm new password"
                                   required
                                   style="background: var(--bg-tertiary); border: 2px solid var(--border-color); border-radius: 12px; color: var(--text-primary);">
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                                <i class="fas fa-save me-2"></i>Change Password
                            </button>
                        </div>
                    </form>
                    
                    <!-- Back to Login -->
                    <div class="text-center mt-4">
                        <a href="{% url 'user_login' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Custom Styles for Responsive Design -->
<style>
    /* Mobile First Responsive Design */
    @media (max-width: 575px) {
        .card {
            margin: 1rem !important;
        }
        
        .card-body {
            padding: 2rem 1.5rem !important;
        }
        
        .fas.fa-lock {
            font-size: 2.5rem !important;
        }
        
        .card-title {
            font-size: 1.5rem !important;
        }
    }
    
    @media (min-width: 576px) and (max-width: 767px) {
        .fas.fa-lock {
            font-size: 2.75rem !important;
        }
        
        .card-title {
            font-size: 1.75rem !important;
        }
    }
    
    @media (min-width: 768px) {
        .fas.fa-lock {
            font-size: 3.5rem !important;
        }
        
        .card-title {
            font-size: 2rem !important;
        }
    }
    
    /* Enhanced Button Styling */
    .btn-primary {
        background: linear-gradient(135deg, var(--secondary-600) 0%, var(--secondary-500) 100%);
        border: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }
    
    .btn-primary:hover::before {
        left: 100%;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }
    
    /* Form Input Styling */
    .form-control:focus {
        background: var(--bg-secondary) !important;
        border-color: var(--secondary-600) !important;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3) !important;
        transform: translateY(-2px);
    }
    
    .form-control::placeholder {
        color: var(--text-muted);
    }
    
    /* Card Animation */
    .card {
        transition: all 0.3s ease;
        backdrop-filter: blur(20px);
    }
    
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }
    
    /* Link Styling */
    .text-decoration-none {
        color: var(--text-secondary) !important;
        transition: all 0.3s ease;
    }
    
    .text-decoration-none:hover {
        color: var(--secondary-600) !important;
    }
    
    /* Password Strength Indicator */
    .password-strength {
        margin-top: 0.5rem;
        font-size: 0.875rem;
    }
    
    .strength-weak { color: #ef4444; }
    .strength-medium { color: #f59e0b; }
    .strength-strong { color: #10b981; }
</style>

<script>
// Password confirmation validation
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('pw');
    const confirmPasswordInput = document.getElementById('cpw');
    
    function validatePasswords() {
        if (passwordInput.value !== confirmPasswordInput.value) {
            confirmPasswordInput.setCustomValidity('Passwords do not match');
        } else {
            confirmPasswordInput.setCustomValidity('');
        }
    }
    
    passwordInput.addEventListener('input', validatePasswords);
    confirmPasswordInput.addEventListener('input', validatePasswords);
});
</script>
{% endblock body %}
