{% extends "index.html" %}

{% block title %}
OTP Verification
{% endblock title %}

{% block body %}

<style>
    /* OTP page container */
    .otp-container {
        min-height: 100vh;
        background: #000000;
        padding: 40px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* OTP card */
    .otp-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 50px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 450px;
        width: 100%;
        position: relative;
        overflow: hidden;
        text-align: center;
    }

    .otp-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe, #00f2fe);
        background-size: 200% 100%;
        animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .otp-title {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
    }

    .otp-subtitle {
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 40px;
        font-size: 1.1rem;
    }

    /* OTP input styling */
    .otp-input-container {
        margin-bottom: 30px;
    }

    .otp-label {
        color: #ffffff;
        font-weight: 600;
        margin-bottom: 15px;
        display: block;
        font-size: 1.1rem;
    }

    .otp-input {
        width: 100%;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        font-size: 1.5rem;
        text-align: center;
        letter-spacing: 0.5rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        box-sizing: border-box;
        font-weight: 600;
    }

    .otp-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: normal;
    }

    .otp-input:focus {
        outline: none;
        border-color: #f093fb;
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 30px rgba(240, 147, 251, 0.4);
        transform: scale(1.02);
    }

    .validate-otp-btn {
        width: 100%;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border: none;
        color: white;
        padding: 18px 30px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(240, 147, 251, 0.3);
        position: relative;
        overflow: hidden;
    }

    .validate-otp-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .validate-otp-btn:hover::before {
        left: 100%;
    }

    .validate-otp-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(240, 147, 251, 0.4);
    }

    .otp-help-text {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
        margin-top: 20px;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
        .otp-container {
            padding: 20px 15px;
        }
        
        .otp-card {
            padding: 30px 25px;
        }
        
        .otp-title {
            font-size: 2rem;
        }
        
        .otp-input {
            font-size: 1.3rem;
            letter-spacing: 0.3rem;
            padding: 18px;
        }
    }

    @media (max-width: 480px) {
        .otp-card {
            padding: 25px 20px;
        }
        
        .otp-title {
            font-size: 1.8rem;
        }
        
        .otp-input {
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
            padding: 16px;
        }
    }
</style>

<div class="otp-container">
    <div class="otp-card">
        <h1 class="otp-title">OTP Verification</h1>
        <p class="otp-subtitle">Enter the OTP sent to your registered mobile number</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="otp-input-container">
                <label class="otp-label" for="otp">Enter OTP</label>
                <input type="text" name="otp" id="otp" class="otp-input" placeholder="000000" maxlength="6" required>
            </div>
            
            <button type="submit" class="validate-otp-btn">Validate OTP</button>
        </form>
        
        <p class="otp-help-text">Didn't receive OTP? Check your mobile number or request again.</p>
    </div>
</div>

<script>
    // Auto-focus on OTP input
    document.addEventListener('DOMContentLoaded', function() {
        const otpInput = document.getElementById('otp');
        if (otpInput) {
            otpInput.focus();
        }
    });
    
    // Format OTP input (numbers only)
    document.getElementById('otp').addEventListener('input', function(e) {
        // Remove non-numeric characters
        this.value = this.value.replace(/[^0-9]/g, '');
    });
</script>

{% endblock body %}
