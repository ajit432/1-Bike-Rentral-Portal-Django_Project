{% extends "index.html" %}

{% block title %}
Add Bikes
{% endblock title %}

{% block body %}

<style>
    /* Add bikes page container */
    .add-bikes-container {
        min-height: 100vh;
        background: #000000;
        padding: 40px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Add bikes card */
    .add-bikes-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 50px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 500px;
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    .add-bikes-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe, #00f2fe);
        background-size: 200% 100%;
        animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .add-bikes-title {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 30px;
    }

    .add-bikes-subtitle {
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        margin-bottom: 40px;
        font-size: 1.1rem;
    }

    /* Form styling */
    .form-group {
        margin-bottom: 25px;
    }

    .form-label {
        color: #ffffff;
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
        font-size: 0.95rem;
    }

    .form-input {
        width: 100%;
        padding: 15px 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.1);
        color: #000000ff;
        font-size: 1rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        box-sizing: border-box;
    }

    .form-input::placeholder {
        color: rgba(255, 255, 255, 0.6);
    }

    .form-input:focus {
        outline: none;
        border-color: #f093fb;
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 20px rgba(240, 147, 251, 0.3);
    }

    .form-input[type="file"] {
        padding: 12px 20px;
        cursor: pointer;
    }

    .form-input[type="file"]::-webkit-file-upload-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        margin-right: 10px;
        cursor: pointer;
        font-weight: 600;
    }

    .add-bike-btn {
        width: 100%;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border: none;
        color: white;
        padding: 18px 30px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(240, 147, 251, 0.3);
        position: relative;
        overflow: hidden;
    }

    .add-bike-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .add-bike-btn:hover::before {
        left: 100%;
    }

    .add-bike-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(240, 147, 251, 0.4);
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
        .add-bikes-container {
            padding: 20px 15px;
        }
        
        .add-bikes-card {
            padding: 30px 25px;
        }
        
        .add-bikes-title {
            font-size: 2rem;
        }
    }

    @media (max-width: 480px) {
        .add-bikes-card {
            padding: 25px 20px;
        }
        
        .add-bikes-title {
            font-size: 1.8rem;
        }
    }
</style>

<div class="add-bikes-container">
    <div class="add-bikes-card">
        <h1 class="add-bikes-title">Add New Bike</h1>
        <p class="add-bikes-subtitle">List your bike for rent and start earning</p>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Bike Details</label>
                {{EBFO.as_p}}
            </div>
            
            <button type="submit" class="add-bike-btn">Add Bike</button>
        </form>
    </div>
</div>

<script>
    // Add form input styling
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.classList.add('form-input');
        });
        
        // Style form paragraphs
        const formParagraphs = document.querySelectorAll('form p');
        formParagraphs.forEach(p => {
            const label = p.querySelector('label');
            const input = p.querySelector('input, select, textarea');
            
            if (label && input) {
                label.classList.add('form-label');
                input.classList.add('form-input');
            }
        });
    });
</script>

{% endblock body %}
